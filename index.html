<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ルーティーン部屋">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234a9c6e'/><text y='.9em' font-size='70' x='50%25' text-anchor='middle'>💪</text></svg>">
<title>晴香 &amp; 陽一のルーティーン部屋</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif; }
#app { display: flex; flex-direction: column; height: 100dvh; background: #b2c9e8; }
#header { background: #4a9c6e; color: white; padding: 10px 14px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; padding-top: max(10px, env(safe-area-inset-top)); }
.avatar-group { display: flex; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; font-size: 16px; border: 2px solid rgba(255,255,255,0.4); }
.avatar:nth-child(2) { margin-left: -8px; }
#header h1 { font-size: 15px; font-weight: 600; }
#header p { font-size: 11px; opacity: 0.85; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #7dffb0; margin-left: auto; flex-shrink: 0; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
#messages { flex: 1; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 6px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
.msg-row { display: flex; align-items: flex-end; gap: 6px; }
.msg-row.me { flex-direction: row-reverse; }
.avatar-sm { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.avatar-sm.haruka { background: #ffb7c5; }
.avatar-sm.yoichi { background: #aed6f1; }
.avatar-sm.ai { background: #4a9c6e; color: white; font-size: 11px; font-weight: 700; }
.name-label { font-size: 11px; color: #555; margin-bottom: 2px; margin-left: 2px; }
.bubble { max-width: 230px; padding: 9px 12px; border-radius: 18px; font-size: 13.5px; line-height: 1.55; word-break: break-word; }
.bubble.sent-h { background: #ff8fab; color: white; border-bottom-right-radius: 4px; }
.bubble.sent-y { background: #4a9c6e; color: white; border-bottom-right-radius: 4px; }
.bubble.received { background: white; color: #1a1a1a; border-bottom-left-radius: 4px; }
.bubble.ai-bubble { background: #e8f7ee; color: #1a3a2a; border-bottom-left-radius: 4px; max-width: 250px; }
.bubble img { max-width: 100%; border-radius: 10px; margin-top: 6px; display: block; }
.time-stamp { font-size: 10px; color: #555; align-self: flex-end; margin-bottom: 2px; flex-shrink: 0; }
.day-divider { text-align: center; font-size: 11px; color: #444; background: rgba(255,255,255,0.45); border-radius: 10px; padding: 3px 12px; align-self: center; margin: 6px 0; }
.typing { display: flex; gap: 4px; padding: 10px 14px; }
.typing span { width: 7px; height: 7px; background: #999; border-radius: 50%; animation: bounce 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
#input-area { background: #f5f5f5; border-top: 0.5px solid #ddd; padding: 8px 10px; flex-shrink: 0; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
.user-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
.tab { flex: 1; padding: 6px; border: 1.5px solid #ccc; border-radius: 20px; background: white; font-size: 12px; cursor: pointer; transition: all 0.2s; text-align: center; color: #555; -webkit-tap-highlight-color: transparent; }
.tab.active-haruka { background: #ffb7c5; border-color: #ff8fab; color: #7a1a3a; font-weight: 700; }
.tab.active-yoichi { background: #aed6f1; border-color: #5a9fd4; color: #0a3a6a; font-weight: 700; }
#statsBar { display: flex; gap: 6px; margin-bottom: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
#statsBar::-webkit-scrollbar { display: none; }
.stat-chip { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 3px 9px; font-size: 11px; color: #444; white-space: nowrap; flex-shrink: 0; }
.stat-chip span { font-weight: 700; color: #4a9c6e; }
.quick-btns { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.qbtn { padding: 5px 10px; border-radius: 14px; border: 1px solid #bbb; background: white; font-size: 11.5px; cursor: pointer; color: #333; transition: all 0.15s; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
.qbtn:active { transform: scale(0.95); background: #e8f7ee; }
.input-row { display: flex; gap: 6px; }
#textInput { flex: 1; border: 1px solid #ccc; border-radius: 20px; padding: 8px 14px; font-size: 16px; outline: none; font-family: inherit; background: white; }
#textInput:focus { border-color: #4a9c6e; }
#sendBtn { width: 38px; height: 38px; border-radius: 50%; background: #4a9c6e; color: white; border: none; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
#imgBtn { width: 38px; height: 38px; border-radius: 50%; background: #6aabca; color: white; border: none; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
#fileInput { display: none; }
#apiModal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
#apiModal.hidden { display: none; }
.modal-box { background: white; border-radius: 20px; padding: 28px 20px; width: 100%; max-width: 340px; }
.modal-box h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; color: #1a1a1a; }
.modal-box p { font-size: 13px; color: #666; margin-bottom: 20px; line-height: 1.6; }
.modal-box input { width: 100%; border: 1.5px solid #ddd; border-radius: 12px; padding: 12px 14px; font-size: 14px; outline: none; font-family: inherit; margin-bottom: 12px; }
.modal-box input:focus { border-color: #4a9c6e; }
.modal-box button { width: 100%; background: #4a9c6e; color: white; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
.modal-box button:active { opacity: 0.85; }
.modal-note { font-size: 11px; color: #bbb; text-align: center; margin-top: 10px; line-height: 1.6; }
.modal-error { color: #e74c3c; font-size: 12px; margin-bottom: 8px; display: none; }
</style>
</head>
<body>
<div id="apiModal">
  <div class="modal-box">
    <h2>🔑 APIキーを設定</h2>
    <p>Anthropic ConsoleのAPIキーを入力してください。このスマホに保存され、次回から自動で使われます。</p>
    <div class="modal-error" id="modalError">APIキーが正しくありません。sk-ant- で始まるキーを入力してください。</div>
    <input type="password" id="apiKeyInput" placeholder="sk-ant-..." autocomplete="off">
    <button onclick="saveApiKey()">保存してはじめる 💪</button>
    <div class="modal-note">キーはこのスマホのブラウザにのみ保存されます。GitHubには一切アップロードされません。</div>
  </div>
</div>
<div id="app">
  <div id="header">
    <div class="avatar-group">
      <div class="avatar">🌸</div>
      <div class="avatar">🏋️</div>
    </div>
    <div>
      <h1>晴香 &amp; 陽一のルーティーン部屋</h1>
      <p id="syncStatus">接続中…</p>
    </div>
    <div class="sync-dot"></div>
  </div>
  <div id="messages"></div>
  <div id="input-area">
    <div class="user-tabs">
      <button class="tab active-haruka" id="tabHaruka" onclick="setUser('haruka')">🌸 晴香</button>
      <button class="tab" id="tabYoichi" onclick="setUser('yoichi')">🏋️ 陽一</button>
    </div>
    <div id="statsBar"></div>
    <div class="quick-btns" id="quickBtns"></div>
    <div class="input-row">
      <button id="imgBtn" onclick="document.getElementById('fileInput').click()">📷</button>
      <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="handleImage(event)">
      <input type="text" id="textInput" placeholder="報告を入力…" onkeydown="if(event.key==='Enter')sendMessage()">
      <button id="sendBtn" onclick="sendMessage()">↑</button>
    </div>
  </div>
</div>
<script>
const FIREBASE_URL = 'https://routine-app-88035-default-rtdb.asia-southeast1.firebasedatabase.app';
const API_KEY_STORAGE = 'routine_api_key';
function getApiKey() { return localStorage.getItem(API_KEY_STORAGE) || ''; }
function saveApiKey() {
  const val = document.getElementById('apiKeyInput').value.trim();
  const errEl = document.getElementById('modalError');
  if (!val.startsWith('sk-ant-')) { errEl.style.display = 'block'; return; }
  errEl.style.display = 'none';
  localStorage.setItem(API_KEY_STORAGE, val);
  document.getElementById('apiModal').classList.add('hidden');
  init();
}
function checkApiKey() {
  if (!getApiKey()) { document.getElementById('apiModal').classList.remove('hidden'); return false; }
  document.getElementById('apiModal').classList.add('hidden');
  return true;
}
const QUICK = {
  haruka: ["家トレ完了","ジムトレ完了","体重計測完了","プロテイン飲んだ","昨夜は酒なし","スキンケア完了","有酸素完了"],
  yoichi: ["家トレ完了","ジムトレ完了","体重計測完了","プロテイン飲んだ","昨夜は酒なし","ランニング完了","ストレッチ完了"]
};
let currentUser = 'haruka';
let sharedData = { haruka: { gym:0, homeGym:0, protein:0, noAlcohol:0, weight:0, skincare:0, cardio:0, streaks:{protein:0,noAlcohol:0,skincare:0}, lastDates:{} }, yoichi: { gym:0, homeGym:0, protein:0, noAlcohol:0, weight:0, running:0, stretch:0, streaks:{protein:0,noAlcohol:0}, lastDates:{} } };
let renderedKeys = new Set();
let swRegistration = null;

// ======== Service Worker & 通知 ========
async function initNotifications() {
  if (!('serviceWorker' in navigator) || !('Notification' in window)) return;
  try {
    swRegistration = await navigator.serviceWorker.register('/routine_app/sw.js');
    const permission = await Notification.requestPermission();
    if (permission === 'granted') {
      console.log('通知許可済み');
    }
  } catch(e) { console.log('SW登録失敗:', e); }
}

function showLocalNotification(title, body) {
  if (Notification.permission !== 'granted') return;
  if (document.visibilityState === 'visible') return; // アプリ開いてる時は通知しない
  if (swRegistration) {
    swRegistration.showNotification(title, {
      body: body,
      icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%234a9c6e"/><text y=".9em" font-size="70" x="50%25" text-anchor="middle">💪</text></svg>',
      vibrate: [200, 100, 200],
      tag: 'routine-msg'
    });
  }
}

// ======== Firebase ========
async function fbGet(path) { const res = await fetch(`${FIREBASE_URL}/${path}.json`); return res.json(); }
async function fbSet(path, data) { await fetch(`${FIREBASE_URL}/${path}.json`, { method: 'PUT', body: JSON.stringify(data) }); }
async function fbPush(path, data) { const res = await fetch(`${FIREBASE_URL}/${path}.json`, { method: 'POST', body: JSON.stringify(data) }); return res.json(); }

function startSync() { syncMessages(); syncStats(); setInterval(syncMessages, 3000); setInterval(syncStats, 5000); }

async function syncMessages() {
  try {
    const msgs = await fbGet('messages');
    if (!msgs) return;
    const entries = Object.entries(msgs).sort((a,b) => a[1].ts - b[1].ts);
    entries.forEach(([key, m]) => {
      if (!renderedKeys.has(key)) {
        renderedKeys.add(key);
        renderMsg(m);
        // 相手のメッセージが来たら通知
        if (m.user !== currentUser && m.role !== 'ai' && m.ts > (Date.now() - 10000)) {
          const name = m.user === 'haruka' ? '🌸 晴香' : '🏋️ 陽一';
          showLocalNotification('ルーティーン部屋', `${name}：${m.text}`);
        }
      }
    });
  } catch(e) {}
}

async function syncStats() {
  try {
    const data = await fbGet('stats');
    if (data) { sharedData = data; updateStatsBar(); }
    document.getElementById('syncStatus').textContent = '同期中 ✓';
  } catch(e) { document.getElementById('syncStatus').textContent = '接続エラー'; }
}

function getTime() { return new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}); }

function renderMsg(m) {
  const box = document.getElementById('messages'); const row = document.createElement('div');
  const isMe = (m.user === currentUser); row.className = 'msg-row' + (isMe ? ' me' : '');
  const sentClass = m.user === 'haruka' ? 'sent-h' : (m.user === 'yoichi' ? 'sent-y' : '');
  const bubbleClass = m.role === 'ai' ? 'ai-bubble' : (isMe ? sentClass : 'received');
  const avatarClass = m.role === 'ai' ? 'ai' : m.user;
  const avatarIcon = m.role === 'ai' ? 'AI' : (m.user === 'haruka' ? '🌸' : '🏋️');
  const name = m.role === 'ai' ? 'AIコーチ' : (m.user === 'haruka' ? '晴香' : '陽一');
  const imgEl = m.imgSrc ? `<img src="${m.imgSrc}" loading="lazy">` : '';
  if (isMe) { row.innerHTML = `<div class="time-stamp">${m.time}</div><div class="bubble ${bubbleClass}">${m.text}${imgEl}</div>`; }
  else { row.innerHTML = `<div class="avatar-sm ${avatarClass}">${avatarIcon}</div><div><div class="name-label">${name}</div><div class="bubble ${bubbleClass}">${m.text}${imgEl}</div></div>`; }
  box.appendChild(row); box.scrollTop = box.scrollHeight;
}
function showTyping() {
  const box = document.getElementById('messages'); const d = document.createElement('div');
  d.className = 'msg-row'; d.id = 'typing-indicator';
  d.innerHTML = `<div class="avatar-sm ai">AI</div><div class="bubble ai-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  box.appendChild(d); box.scrollTop = box.scrollHeight;
}
function removeTyping() { const t = document.getElementById('typing-indicator'); if (t) t.remove(); }
function updateRecord(user, text) {
  const r = sharedData[user]; const today = new Date().toDateString(); const yesterday = new Date(Date.now()-86400000).toDateString();
  if (text.includes('ジムトレ')) r.gym++;
  if (text.includes('家トレ')) r.homeGym++;
  if (text.includes('体重計測')) r.weight++;
  if (text.includes('プロテイン')) { r.protein++; r.streaks.protein=(r.lastDates.protein===yesterday)?(r.streaks.protein||0)+1:1; r.lastDates.protein=today; }
  if (text.includes('酒なし')||text.includes('禁酒')) { r.noAlcohol++; r.streaks.noAlcohol=(r.lastDates.noAlcohol===yesterday)?(r.streaks.noAlcohol||0)+1:1; r.lastDates.noAlcohol=today; }
  if (text.includes('スキンケア')) { r.skincare=(r.skincare||0)+1; r.streaks.skincare=(r.lastDates.skincare===yesterday)?(r.streaks.skincare||0)+1:1; r.lastDates.skincare=today; }
  if (text.includes('有酸素')||text.includes('ランニング')) r.cardio=(r.cardio||0)+1;
  if (text.includes('ストレッチ')) r.stretch=(r.stretch||0)+1;
  fbSet('stats', sharedData); updateStatsBar();
}
function updateStatsBar() {
  const h = sharedData.haruka, y = sharedData.yoichi;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-chip">🌸ジム <span>${h.gym}</span>回</div>
    <div class="stat-chip">🌸禁酒 <span>${h.streaks.noAlcohol||0}</span>日連続</div>
    <div class="stat-chip">🌸プロテ <span>${h.streaks.protein||0}</span>日連続</div>
    <div class="stat-chip">🏋️ジム <span>${y.gym}</span>回</div>
    <div class="stat-chip">🏋️禁酒 <span>${y.streaks.noAlcohol||0}</span>日連続</div>`;
}
function setUser(u) {
  currentUser = u;
  document.getElementById('tabHaruka').className = 'tab'+(u==='haruka'?' active-haruka':'');
  document.getElementById('tabYoichi').className = 'tab'+(u==='yoichi'?' active-yoichi':'');
  renderQuickBtns();
}
function renderQuickBtns() {
  document.getElementById('quickBtns').innerHTML = QUICK[currentUser].map(b => `<button class="qbtn" onclick="sendReport('${b}')">${b}</button>`).join('');
}
function buildPrompt(user, text) {
  const r = sharedData[user]; const name = user === 'haruka' ? '晴香' : '陽一';
  const ctx = user === 'haruka' ? '晴香さんはジムトレ・美容・肉体改造・禁酒に取り組む女性です。' : '陽一さんは筋トレと健康習慣に取り組んでいます。';
  return `あなたはルーティーン管理AIコーチです。${ctx}
累計：ジムトレ${r.gym}回、家トレ${r.homeGym}回、プロテイン${r.protein}回(連続${r.streaks?.protein||0}日)、禁酒${r.noAlcohol}日(連続${r.streaks?.noAlcohol||0}日)、体重計測${r.weight}回
今回の報告：「${text}」
ルール：
- ${name}さんの名前を必ず呼ぶ
- 毎回まったく違うユニークな比喩・ユーモアを使う（桜、ロケット、伝説の戦士、神話、宇宙、料理、動物など何でも）
- 連続記録・累計が増えたら必ず言及して褒める
- 3〜4文、絵文字2〜3個
- 日本語で返答`;
}
async function callAI(prompt, imageData) {
  const API_KEY = getApiKey();
  const content = imageData ? [{ type:"image", source:{ type:"base64", media_type: imageData.type, data: imageData.b64 }}, { type:"text", text: prompt }] : prompt;
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-api-key": API_KEY, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
    body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1000, messages: [{ role: "user", content }] })
  });
  const data = await res.json();
  return data.content?.[0]?.text || "素晴らしい！続けてね💪";
}
async function sendReport(text) {
  const user = currentUser; const time = getTime();
  const msgObj = { user, role:'user', text, time, ts: Date.now() };
  const ref = await fbPush('messages', msgObj);
  renderedKeys.add(ref.name); renderMsg(msgObj);
  updateRecord(user, text); showTyping();
  try {
    const reply = await callAI(buildPrompt(user, text));
    removeTyping();
    const aiMsg = { user:'ai', role:'ai', text: reply, time: getTime(), ts: Date.now() };
    const aiRef = await fbPush('messages', aiMsg);
    renderedKeys.add(aiRef.name); renderMsg(aiMsg);
  } catch(e) {
    removeTyping();
    const aiMsg = { user:'ai', role:'ai', text:'報告ありがとう！記録したよ！💪', time: getTime(), ts: Date.now() };
    const aiRef = await fbPush('messages', aiMsg);
    renderedKeys.add(aiRef.name); renderMsg(aiMsg);
  }
}
async function sendMessage() {
  const input = document.getElementById('textInput'); const text = input.value.trim();
  if (!text) return; input.value = ''; await sendReport(text);
}
async function handleImage(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    const b64 = e.target.result.split(',')[1]; const user = currentUser;
    const name = user === 'haruka' ? '晴香' : '陽一'; const time = getTime();
    const msgObj = { user, role:'user', text:'食事写真を送りました 🍽️', time, imgSrc: e.target.result, ts: Date.now() };
    const ref = await fbPush('messages', msgObj);
    renderedKeys.add(ref.name); renderMsg(msgObj); showTyping();
    try {
      const prompt = `この食事写真を詳しく分析して日本語で：1)写っている料理名と推定カロリー範囲 2)この食事の栄養バランスの良い点2〜3つ 3)${name}さんの筋トレ・美容・肉体改造への具体的な応援コメント。毎回違う表現で、絵文字を使って明るく4〜5文で。`;
      const reply = await callAI(prompt, { b64, type: file.type });
      removeTyping();
      const aiMsg = { user:'ai', role:'ai', text: reply, time: getTime(), ts: Date.now() };
      const aiRef = await fbPush('messages', aiMsg);
      renderedKeys.add(aiRef.name); renderMsg(aiMsg);
    } catch(e) {
      removeTyping();
      const aiMsg = { user:'ai', role:'ai', text:'おいしそう！栄養しっかり摂れてるね💪', time: getTime(), ts: Date.now() };
      const aiRef = await fbPush('messages', aiMsg);
      renderedKeys.add(aiRef.name); renderMsg(aiMsg);
    }
  };
  reader.readAsDataURL(file); event.target.value = '';
}
async function init() {
  if (!checkApiKey()) return;
  await initNotifications();
  renderQuickBtns(); updateStatsBar();
  await syncMessages();
  const msgs = await fbGet('messages');
  if (!msgs) {
    const welcome = { user:'ai', role:'ai', text:'こんにちは！晴香さん＆陽一さん 🌟 今日もルーティーンを一緒に記録しよう！下のボタンで報告してね。食事写真は📷から送れるよ！', time: getTime(), ts: Date.now() };
    const ref = await fbPush('messages', welcome);
    renderedKeys.add(ref.name); renderMsg(welcome);
  }
  startSync();
}
init();
</script>
</body>
</html>
