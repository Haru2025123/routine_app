<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ルーティーン部屋">
<title>晴香 &amp; 陽一のルーティーン部屋</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif; }
#app { display: flex; flex-direction: column; height: 100dvh; background: #b2c9e8; }
#header { background: #4a9c6e; color: white; padding: 10px 14px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; padding-top: max(10px, env(safe-area-inset-top)); }
.avatar-group { display: flex; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; font-size: 16px; border: 2px solid rgba(255,255,255,0.4); }
.avatar:nth-child(2) { margin-left: -8px; }
#header h1 { font-size: 15px; font-weight: 600; }
#header p { font-size: 11px; opacity: 0.85; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #7dffb0; margin-left: auto; flex-shrink: 0; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
#messages { flex: 1; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 6px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
.msg-row { display: flex; align-items: flex-end; gap: 6px; }
.msg-row.me { flex-direction: row-reverse; }
.avatar-sm { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.avatar-sm.haruka { background: #ffb7c5; }
.avatar-sm.yoichi { background: #aed6f1; }
.avatar-sm.ai { background: #4a9c6e; color: white; font-size: 11px; font-weight: 700; }
.name-label { font-size: 11px; color: #555; margin-bottom: 2px; margin-left: 2px; }
.bubble { max-width: 230px; padding: 9px 12px; border-radius: 18px; font-size: 13.5px; line-height: 1.55; word-break: break-word; }
.bubble.sent-h { background: #ff8fab; color: white; border-bottom-right-radius: 4px; }
.bubble.sent-y { background: #4a9c6e; color: white; border-bottom-right-radius: 4px; }
.bubble.received { background: white; color: #1a1a1a; border-bottom-left-radius: 4px; }
.bubble.ai-bubble { background: #e8f7ee; color: #1a3a2a; border-bottom-left-radius: 4px; max-width: 250px; }
.bubble img { max-width: 100%; border-radius: 10px; margin-top: 6px; display: block; }
.time-stamp { font-size: 10px; color: #555; align-self: flex-end; margin-bottom: 2px; flex-shrink: 0; }
.day-divider { text-align: center; font-size: 11px; color: #444; background: rgba(255,255,255,0.45); border-radius: 10px; padding: 3px 12px; align-self: center; margin: 6px 0; }
.typing { display: flex; gap: 4px; padding: 10px 14px; }
.typing span { width: 7px; height: 7px; background: #999; border-radius: 50%; animation: bounce 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
#input-area { background: #f5f5f5; border-top: 0.5px solid #ddd; padding: 8px 10px; flex-shrink: 0; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
.user-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
.tab { flex: 1; padding: 6px; border: 1.5px solid #ccc; border-radius: 20px; background: white; font-size: 12px; cursor: pointer; transition: all 0.2s; text-align: center; color: #555; -webkit-tap-highlight-color: transparent; }
.tab.active-haruka { background: #ffb7c5; border-color: #ff8fab; color: #7a1a3a; font-weight: 700; }
.tab.active-yoichi { background: #aed6f1; border-color: #5a9fd4; color: #0a3a6a; font-weight: 700; }
#statsBar { display: flex; gap: 6px; margin-bottom: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
#statsBar::-webkit-scrollbar { display: none; }
.stat-chip { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 3px 9px; font-size: 11px; color: #444; white-space: nowrap; flex-shrink: 0; }
.stat-chip span { font-weight: 700; color: #4a9c6e; }
.quick-btns { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.qbtn { padding: 5px 10px; border-radius: 14px; border: 1px solid #bbb; background: white; font-size: 11.5px; cursor: pointer; color: #333; transition: all 0.15s; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
.qbtn:active { transform: scale(0.95); background: #e8f7ee; }
.input-row { display: flex; gap: 6px; }
#textInput { flex: 1; border: 1px solid #ccc; border-radius: 20px; padding: 8px 14px; font-size: 16px; outline: none; font-family: inherit; background: white; }
#textInput:focus { border-color: #4a9c6e; }
#sendBtn { width: 38px; height: 38px; border-radius: 50%; background: #4a9c6e; color: white; border: none; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
#imgBtn { width: 38px; height: 38px; border-radius: 50%; background: #6aabca; color: white; border: none; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
#fileInput { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="avatar-group">
      <div class="avatar">🌸</div>
      <div class="avatar">🏋️</div>
    </div>
    <div>
      <h1>晴香 &amp; 陽一のルーティーン部屋</h1>
      <p id="syncStatus">データ読み込み中…</p>
    </div>
    <div class="sync-dot"></div>
  </div>
  <div id="messages"></div>
  <div id="input-area">
    <div class="user-tabs">
      <button class="tab active-haruka" id="tabHaruka" onclick="setUser('haruka')">🌸 晴香</button>
      <button class="tab" id="tabYoichi" onclick="setUser('yoichi')">🏋️ 陽一</button>
    </div>
    <div id="statsBar"></div>
    <div class="quick-btns" id="quickBtns"></div>
    <div class="input-row">
      <button id="imgBtn" onclick="document.getElementById('fileInput').click()">📷</button>
      <input type="file" id="fileInput" accept="image/*" onchange="handleImage(event)">
      <input type="text" id="textInput" placeholder="報告を入力…" onkeydown="if(event.key==='Enter')sendMessage()">
      <button id="sendBtn" onclick="sendMessage()">↑</button>
    </div>
  </div>
</div>

<script>
// ======== 設定 ========
// Anthropic APIキー（後で入力してください）
const API_KEY = 'YOUR_API_KEY_HERE';

const QUICK = {
  haruka: ["家トレ完了","ジムトレ完了","体重計測完了","プロテイン飲んだ","昨夜は酒なし","スキンケア完了","有酸素完了"],
  yoichi: ["家トレ完了","ジムトレ完了","体重計測完了","プロテイン飲んだ","昨夜は酒なし","ランニング完了","ストレッチ完了"]
};

const STORAGE_KEY = 'routine_data_v1';
const MSGS_KEY = 'routine_msgs_v1';

let currentUser = 'haruka';
let sharedData = null;

function defaultData() {
  return {
    haruka: { gym:0, homeGym:0, protein:0, noAlcohol:0, weight:0, skincare:0, cardio:0, streaks:{protein:0,noAlcohol:0,skincare:0}, lastDates:{} },
    yoichi: { gym:0, homeGym:0, protein:0, noAlcohol:0, weight:0, running:0, stretch:0, streaks:{protein:0,noAlcohol:0}, lastDates:{} }
  };
}

function loadData() {
  try {
    const d = localStorage.getItem(STORAGE_KEY);
    sharedData = d ? JSON.parse(d) : defaultData();
  } catch(e) { sharedData = defaultData(); }
  updateStatsBar();
  document.getElementById('syncStatus').textContent = '記録中 ✓';
}

function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(sharedData)); } catch(e) {}
}

function loadMessages() {
  try {
    const d = localStorage.getItem(MSGS_KEY);
    if (d) {
      const msgs = JSON.parse(d);
      addDivider('今日');
      msgs.slice(-40).forEach(m => renderMsg(m));
      document.getElementById('messages').scrollTop = 99999;
      return true;
    }
  } catch(e) {}
  return false;
}

function saveMsgAppend(msgObj) {
  try {
    let msgs = [];
    const d = localStorage.getItem(MSGS_KEY);
    if (d) msgs = JSON.parse(d);
    msgs.push(msgObj);
    if (msgs.length > 80) msgs = msgs.slice(-80);
    localStorage.setItem(MSGS_KEY, JSON.stringify(msgs));
  } catch(e) {}
}

function getTime() {
  return new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
}

function addDivider(text) {
  const box = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = 'day-divider';
  d.textContent = text;
  box.appendChild(d);
}

function renderMsg(m) {
  const box = document.getElementById('messages');
  const row = document.createElement('div');
  const isMe = (m.user === currentUser);
  row.className = 'msg-row' + (isMe ? ' me' : '');
  const sentClass = m.user === 'haruka' ? 'sent-h' : (m.user === 'yoichi' ? 'sent-y' : '');
  const bubbleClass = m.role === 'ai' ? 'ai-bubble' : (isMe ? sentClass : 'received');
  const avatarClass = m.role === 'ai' ? 'ai' : m.user;
  const avatarIcon = m.role === 'ai' ? 'AI' : (m.user === 'haruka' ? '🌸' : '🏋️');
  const name = m.role === 'ai' ? 'AIコーチ' : (m.user === 'haruka' ? '晴香' : '陽一');
  const imgEl = m.imgSrc ? `<img src="${m.imgSrc}" loading="lazy">` : '';
  if (isMe) {
    row.innerHTML = `<div class="time-stamp">${m.time}</div><div class="bubble ${bubbleClass}">${m.text}${imgEl}</div>`;
  } else {
    row.innerHTML = `<div class="avatar-sm ${avatarClass}">${avatarIcon}</div><div><div class="name-label">${name}</div><div class="bubble ${bubbleClass}">${m.text}${imgEl}</div></div>`;
  }
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}

function addAndSaveMsg(msgObj) {
  renderMsg(msgObj);
  saveMsgAppend(msgObj);
}

function showTyping() {
  const box = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = 'msg-row';
  d.id = 'typing-indicator';
  d.innerHTML = `<div class="avatar-sm ai">AI</div><div class="bubble ai-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}
function removeTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

function updateRecord(user, text) {
  const r = sharedData[user];
  const today = new Date().toDateString();
  const yesterday = new Date(Date.now()-86400000).toDateString();
  if (text.includes('ジムトレ')) r.gym++;
  if (text.includes('家トレ')) r.homeGym++;
  if (text.includes('体重計測')) r.weight++;
  if (text.includes('プロテイン')) {
    r.protein++;
    r.streaks.protein = (r.lastDates.protein === yesterday) ? (r.streaks.protein||0)+1 : 1;
    r.lastDates.protein = today;
  }
  if (text.includes('酒なし') || text.includes('禁酒')) {
    r.noAlcohol++;
    r.streaks.noAlcohol = (r.lastDates.noAlcohol === yesterday) ? (r.streaks.noAlcohol||0)+1 : 1;
    r.lastDates.noAlcohol = today;
  }
  if (text.includes('スキンケア')) {
    r.skincare=(r.skincare||0)+1;
    r.streaks.skincare=(r.lastDates.skincare===yesterday)?(r.streaks.skincare||0)+1:1;
    r.lastDates.skincare=today;
  }
  if (text.includes('有酸素') || text.includes('ランニング')) r.cardio=(r.cardio||0)+1;
  if (text.includes('ストレッチ')) r.stretch=(r.stretch||0)+1;
  saveData();
  updateStatsBar();
}

function updateStatsBar() {
  if (!sharedData) return;
  const h = sharedData.haruka, y = sharedData.yoichi;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-chip">🌸ジム <span>${h.gym}</span>回</div>
    <div class="stat-chip">🌸禁酒 <span>${h.streaks.noAlcohol||0}</span>日連続</div>
    <div class="stat-chip">🌸プロテ <span>${h.streaks.protein||0}</span>日連続</div>
    <div class="stat-chip">🏋️ジム <span>${y.gym}</span>回</div>
    <div class="stat-chip">🏋️禁酒 <span>${y.streaks.noAlcohol||0}</span>日連続</div>
  `;
}

function setUser(u) {
  currentUser = u;
  document.getElementById('tabHaruka').className = 'tab'+(u==='haruka'?' active-haruka':'');
  document.getElementById('tabYoichi').className = 'tab'+(u==='yoichi'?' active-yoichi':'');
  renderQuickBtns();
}

function renderQuickBtns() {
  document.getElementById('quickBtns').innerHTML = QUICK[currentUser].map(b =>
    `<button class="qbtn" onclick="sendReport('${b}')">${b}</button>`).join('');
}

function buildPrompt(user, text) {
  const r = sharedData[user];
  const name = user === 'haruka' ? '晴香' : '陽一';
  const ctx = user === 'haruka' ? '晴香さんはジムトレ・美容・肉体改造・禁酒に取り組む女性です。' : '陽一さんは筋トレと健康習慣に取り組んでいます。';
  return `あなたはルーティーン管理AIコーチです。

${ctx}
累計：ジムトレ${r.gym}回、家トレ${r.homeGym}回、プロテイン${r.protein}回(連続${r.streaks?.protein||0}日)、禁酒${r.noAlcohol}日(連続${r.streaks?.noAlcohol||0}日)、体重計測${r.weight}回

今回の報告：「${text}」

ルール：
- ${name}さんの名前を必ず呼ぶ
- 毎回まったく違うユニークな比喩・ユーモアを使う（桜、ロケット、伝説の戦士、神話、宇宙、料理、動物など何でも）
- 連続記録・累計が増えたら必ず言及
- 3〜4文、絵文字2〜3個
- 日本語で返答`;
}

async function callAI(messages, imageData) {
  const content = imageData
    ? [{ type:"image", source:{ type:"base64", media_type: imageData.type, data: imageData.b64 }}, { type:"text", text: messages }]
    : messages;
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": API_KEY,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      messages: [{ role: "user", content }]
    })
  });
  const data = await res.json();
  return data.content?.[0]?.text || "素晴らしい！記録したよ💪";
}

async function sendReport(text) {
  const user = currentUser;
  const time = getTime();
  addAndSaveMsg({ user, role:'user', text, time });
  updateRecord(user, text);
  showTyping();
  try {
    const reply = await callAI(buildPrompt(user, text));
    removeTyping();
    addAndSaveMsg({ user:'ai', role:'ai', text: reply, time: getTime() });
  } catch(e) {
    removeTyping();
    addAndSaveMsg({ user:'ai', role:'ai', text:'報告ありがとう！記録したよ！💪', time: getTime() });
  }
}

async function sendMessage() {
  const input = document.getElementById('textInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  await sendReport(text);
}

async function handleImage(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    const b64 = e.target.result.split(',')[1];
    const user = currentUser;
    const name = user === 'haruka' ? '晴香' : '陽一';
    const time = getTime();
    addAndSaveMsg({ user, role:'user', text:'食事写真を送りました 🍽️', time, imgSrc: e.target.result });
    showTyping();
    try {
      const prompt = `この食事写真について日本語で：1)推定カロリー範囲 2)栄養バランスの良い点2〜3つ 3)${name}さんの筋トレ・美容・肉体改造への応援コメント。絵文字を使って明るく4〜5文で。`;
      const reply = await callAI(prompt, { b64, type: file.type });
      removeTyping();
      addAndSaveMsg({ user:'ai', role:'ai', text: reply, time: getTime() });
    } catch(e) {
      removeTyping();
      addAndSaveMsg({ user:'ai', role:'ai', text:'おいしそう！栄養しっかり摂れてるね💪', time: getTime() });
    }
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

function init() {
  loadData();
  const hadMsgs = loadMessages();
  if (!hadMsgs) {
    addDivider('今日');
    const welcome = { user:'ai', role:'ai', text:'こんにちは！晴香さん＆陽一さん 🌟 今日もルーティーンを一緒に記録しよう！下のボタンで報告してね。食事写真は📷から送れるよ！', time: getTime() };
    addAndSaveMsg(welcome);
  }
  renderQuickBtns();
}

init();
</script>
</body>
</html>
